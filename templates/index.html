<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>台灣火車站查詢</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">台灣火車站查詢系統</h1>
        <input type="text" id="searchInput" class="form-control" placeholder="輸入車站名稱，如 台北">
        <button class="btn btn-primary mt-2" onclick="searchStation()">查詢</button>
        <ul class="list-group mt-4" id="resultsList"></ul>
    </div>

    <script>
        function searchStation() {
            const keyword = document.getElementById('searchInput').value;
            fetch(`/search?keyword=${encodeURIComponent(keyword)}`)
                .then(response => response.json())
                .then(data => {
                    const list = document.getElementById('resultsList');
                    list.innerHTML = '';
                    if (data.length === 0) {
                        list.innerHTML = '<li class="list-group-item">查無資料</li>';
                    } else {
                        data.forEach(station => {
                            const item = document.createElement('li');
                            item.className = 'list-group-item';
                            item.textContent = `${station.StationName} - ${station.Address}`;
                            list.appendChild(item);
                        });
                    }
                });
        }
    </script>
</body>
</html>
